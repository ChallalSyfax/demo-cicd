[project]
name = "demo-cicd"
version = "0.2.0"
description = "API FastAPI de crédit-bail servant de support à la comparaison de pipelines CI/CD DevSecOps."
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
target-version = "py311"
line-length = 100
# Cible py311 : version des images conteneur (Debian 12 / distroless).

[tool.ruff.lint]
# E/F : pycodestyle + pyflakes ; I : import sorting ; UP : pyupgrade ; B : bugbear.
select = ["E", "F", "I", "UP", "B"]
