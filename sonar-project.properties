# Configuration SonarCloud (valeurs non sensibles, versionnées).
# À adapter aux valeurs réelles de ton organisation / projet sur sonarcloud.io.
sonar.projectKey=ChallalSyfax_demo-cicd
sonar.organization=challalsyfax

# Périmètre analysé.
sonar.sources=app
sonar.tests=tests

# Import du rapport de couverture produit par pytest (coverage.xml).
sonar.python.coverage.reportPaths=coverage.xml

# Quality gate BLOQUANT : l'analyse attend le verdict du gate et fait échouer
# le job si le gate n'est pas « passed » (utilisé par le pipeline C sur PR).
sonar.qualitygate.wait=true
