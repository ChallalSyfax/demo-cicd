# Pipeline C — stratégie conditionnelle multi-niveaux.
#
# Le travail logique reste celui de A/B ; ce qui change, c'est QUELS contrôles
# s'exécutent selon le contexte :
#   - pull_request (vers main) : contrôles RAPIDES (test, lint, SAST) + quality
#     gate SonarCloud BLOQUANT. Les contrôles lourds (secret, SBOM, SCA) sont
#     DIFFÉRÉS -> c'est la « fenêtre d'exposition » étudiée à l'Exp.2.
#   - push sur main / workflow_dispatch : chaîne Couche 1 COMPLÈTE.
#
# En workflow_dispatch, C exécute le même ensemble Couche 1 que A et B, ce qui
# garantit une comparaison honnête entre les trois stratégies.

name: Pipeline C - Conditional

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # --- Contrôles rapides : TOUS les contextes ---------------------------------
  test:
    name: Tests + coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Tests + coverage
        env:
          CALIBRATION_N: "60000"   # ~20 s de charge déterministe (voir pipeline A)
        run: pytest
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 30

  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: |
          python -m pip install --upgrade pip
          pip install ruff==0.8.4
      - run: ruff check .

  sast:
    name: SAST (Bandit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: |
          python -m pip install --upgrade pip
          pip install bandit==1.8.0
      - run: bandit -r app -q

  # --- Quality gate BLOQUANT (sonar.qualitygate.wait=true) --------------------
  sonar:
    name: SonarCloud quality gate
    runs-on: ubuntu-24.04
    needs: test
    # Gate uniquement sur pull_request : ainsi le service externe SonarCloud
    # n'entre pas dans le chronométrage de la campagne (workflow_dispatch),
    # ce qui garantit une comparaison A/B/C sur le même travail Couche 1.
    if: github.event_name == 'pull_request'
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
      # Sautée proprement si le secret n'est pas configuré (mais le gate exige le token).
      - name: SonarCloud analysis (blocking gate)
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarcloud-github-action@v3.1.0

  # --- Contrôles lourds : différés hors pull_request --------------------------
  secret:
    name: Secret scan (Trivy)
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: "."
          scanners: secret
          format: json
          output: trivy-secret.json
          exit-code: "0"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-secret
          path: trivy-secret.json
          if-no-files-found: warn
          retention-days: 30

  sbom:
    name: SBOM (Syft)
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: anchore/sbom-action@v0.17.2
        with:
          path: "."
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cyclonedx.json
          if-no-files-found: warn
          retention-days: 30

  trivy:
    name: SCA — vulnerability scan (Trivy fs)
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: "."
          scanners: vuln
          format: json
          output: trivy-fs.json
          severity: CRITICAL,HIGH,MEDIUM,LOW
          exit-code: "0"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-fs.json
          if-no-files-found: warn
          retention-days: 30
