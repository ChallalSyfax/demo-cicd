# Pipeline C — stratégie conditionnelle multi-niveaux.
#
# Objectif : adapter le niveau de contrôle au contexte (et non seulement
# accélérer). Le travail logique reste celui de A et B ; ce qui change, c'est
# QUELS jobs s'exécutent selon l'événement déclencheur.
#
#   - pull_request (vers main) : contrôles rapides  -> test, lint, sonar
#   - push sur main            : chaîne complète     -> test, lint, sonar, sbom, trivy
#   - workflow_dispatch        : chaîne complète     -> idem (campagnes de mesure)
#
# En mode workflow_dispatch, C exécute exactement le même ensemble logique que
# A et B, ce qui garantit une comparaison honnête entre les trois stratégies.

name: Pipeline C - Conditional

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # --- Contrôles rapides : exécutés dans TOUS les contextes --------------------

  test:
    name: Tests + coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python (with pip cache)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: pytest

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 30

  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python (with pip cache)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.6.9

      - name: Lint with Ruff
        run: ruff check .

  sonar:
    name: SonarCloud analysis
    runs-on: ubuntu-latest
    needs: test

    # Défini au niveau du job : le bloc env: d'une étape n'est pas visible
    # depuis le if: de cette même étape.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report

      # Sautée proprement tant que SONAR_TOKEN n'est pas configuré.
      - name: SonarCloud analysis
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarcloud-github-action@v3.1.0

  # --- Contrôles lourds : uniquement sur push main ou lancement manuel ---------

  sbom:
    name: SBOM (Syft)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@v0.17.2
        with:
          path: "."
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cyclonedx.json
          if-no-files-found: warn
          retention-days: 30

  trivy:
    name: Vulnerability scan (Trivy)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Posture "observation" : exit-code 0 => produit toujours le rapport.
      - name: Vulnerability scan (Trivy)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: "."
          scanners: vuln
          format: json
          output: trivy-fs.json
          severity: CRITICAL,HIGH,MEDIUM,LOW
          exit-code: "0"

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-fs.json
          if-no-files-found: warn
          retention-days: 30
