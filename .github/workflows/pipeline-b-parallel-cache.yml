# Pipeline B — stratégie parallèle + cache, Couche 1 (chronométrée).
#
# Même travail logique que A (lint, SAST, tests, secret, SBOM, SCA), mais
# réorganisé en jobs INDÉPENDANTS exécutés en parallèle, avec cache pip.
# SonarCloud et la Couche 2 restent hors de cette campagne (cf. pipeline A).
#
# Déclenchement manuel uniquement, pour maîtriser les runs de mesure.

name: Pipeline B - Parallel + Cache

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests + coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Tests + coverage
        env:
          CALIBRATION_N: "60000"   # ~20 s de charge déterministe (voir pipeline A)
        run: pytest
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 30

  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: |
          python -m pip install --upgrade pip
          pip install ruff==0.8.4
      - run: ruff check .

  sast:
    name: SAST (Bandit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: |
          python -m pip install --upgrade pip
          pip install bandit==1.8.0
      - run: bandit -r app -q

  secret:
    name: Secret scan (Trivy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: "."
          scanners: secret
          format: json
          output: trivy-secret.json
          exit-code: "0"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-secret
          path: trivy-secret.json
          if-no-files-found: warn
          retention-days: 30

  sbom:
    name: SBOM (Syft)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: anchore/sbom-action@v0.17.2
        with:
          path: "."
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cyclonedx.json
          if-no-files-found: warn
          retention-days: 30

  trivy:
    name: SCA — vulnerability scan (Trivy fs)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: "."
          scanners: vuln
          format: json
          output: trivy-fs.json
          severity: CRITICAL,HIGH,MEDIUM,LOW
          exit-code: "0"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-fs.json
          if-no-files-found: warn
          retention-days: 30
