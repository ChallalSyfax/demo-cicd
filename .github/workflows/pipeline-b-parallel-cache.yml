# Pipeline B — stratégie parallèle + cache.
#
# Version optimisée du pipeline A : le travail logique est identique
# (tests, Ruff, SonarCloud, SBOM Syft, scan Trivy, archivage des rapports),
# seule l'orchestration change :
#   - A = un seul job séquentiel, sans cache ;
#   - B = plusieurs jobs parallèles, avec cache pip.
#
# Jobs indépendants exécutés en parallèle : test, lint, sbom, trivy.
# Dépendance de données : sonar attend test (il importe coverage.xml).
#
# Déclenchement manuel uniquement, pour maîtriser les runs de mesure.

name: Pipeline B - Parallel + Cache

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # --- Vague parallèle : test / lint / sbom / trivy sont indépendants -----------

  test:
    name: Tests + coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python (with pip cache)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: pytest

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 30

  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python (with pip cache)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # N'installe que Ruff : le job lint n'a besoin de rien d'autre.
      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.6.9

      - name: Lint with Ruff
        run: ruff check .

  sbom:
    name: SBOM (Syft)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Aucun pip install : Syft lit les manifestes du dépôt.
      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@v0.17.2
        with:
          path: "."
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cyclonedx.json
          if-no-files-found: warn
          retention-days: 30

  trivy:
    name: Vulnerability scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Aucun pip install : Trivy scanne le filesystem / les manifestes.
      # Posture "observation" : exit-code 0 => produit toujours le rapport.
      - name: Vulnerability scan (Trivy)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: "."
          scanners: vuln
          format: json
          output: trivy-fs.json
          severity: CRITICAL,HIGH,MEDIUM,LOW
          exit-code: "0"

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-fs.json
          if-no-files-found: warn
          retention-days: 30

  # --- Job dépendant : sonar attend test pour récupérer coverage.xml -----------

  sonar:
    name: SonarCloud analysis
    runs-on: ubuntu-latest
    needs: test

    # Défini au niveau du job : le bloc env: d'une étape n'est pas visible
    # depuis le if: de cette même étape.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Récupère coverage.xml produit par le job test.
      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report

      # Sautée proprement tant que SONAR_TOKEN n'est pas configuré.
      - name: SonarCloud analysis
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarcloud-github-action@v3.1.0
