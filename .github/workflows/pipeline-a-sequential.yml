# Pipeline A — stratégie séquentielle (baseline de référence).
#
# Objectif : exécuter toutes les étapes DevSecOps dans un seul job, dans l'ordre,
# sans aucune optimisation (pas de cache, pas de parallélisation). Ce workflow sert
# de point de comparaison pour les stratégies B (parallèle + cache) et C (conditionnel).
#
# Déclenchement manuel uniquement, pour maîtriser les runs de mesure.

name: Pipeline A - Sequential

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline:
    name: Sequential DevSecOps pipeline
    runs-on: ubuntu-latest

    steps:
      # 1. Récupération du code (fetch-depth: 0 requis pour une analyse Sonar correcte).
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Mise en place de Python (version alignée sur l'environnement local).
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Installation des dépendances (aucun cache : c'est volontaire pour la baseline).
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # 4. Tests + couverture (génère coverage.xml, consommé ensuite par SonarCloud).
      - name: Run tests with coverage
        run: pytest

      # 5. Contrôle qualité local rapide (barrière : fait échouer le build si non conforme).
      - name: Lint with Ruff
        run: ruff check .

      # 6. Analyse SonarCloud.
      #    Sautée proprement tant que le secret SONAR_TOKEN n'est pas configuré,
      #    afin de ne pas bloquer les premiers runs.
      - name: SonarCloud analysis
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarcloud-github-action@v3.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # 7. Génération du SBOM avec Syft (format CycloneDX JSON).
      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@v0.17.2
        with:
          path: "."
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json

      # 8. Scan de vulnérabilités Trivy sur le filesystem / les dépendances.
      #    Posture "observation" : exit-code 0 => produit toujours le rapport sans
      #    casser le build. Le durcissement (échec sur CRITICAL) sera une amélioration.
      - name: Vulnerability scan (Trivy)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: "."
          scanners: vuln
          format: json
          output: trivy-fs.json
          severity: CRITICAL,HIGH,MEDIUM,LOW
          exit-code: "0"

      # 9. Archivage des rapports produits (if: always() => même si une étape a échoué).
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-a-reports
          path: |
            coverage.xml
            sbom.cyclonedx.json
            trivy-fs.json
          if-no-files-found: warn
          retention-days: 30
