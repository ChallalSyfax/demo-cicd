# Pipeline A — stratégie séquentielle (baseline), Couche 1 (chronométrée).
#
# Tous les contrôles déterministes s'enchaînent dans UN seul job, sans cache ni
# parallélisme : c'est le point de comparaison des stratégies B et C.
# SonarCloud (service externe) et la Couche 2 (image, signature) sont EXCLUS du
# chronométrage : ils vivent ailleurs (gate PR de C ; workflow supply-chain).
#
# Déclenchement manuel uniquement, pour maîtriser les runs de mesure.

name: Pipeline A - Sequential

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline:
    name: Sequential DevSecOps (Couche 1)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (Ruff)
        run: ruff check .

      - name: SAST (Bandit)
        run: bandit -r app -q

      - name: Tests + coverage
        env:
          CALIBRATION_N: "60000"   # charge déterministe (~20 s) : allonge le job de test
          # Réglable : ~0,32 ms/contrat. À affiner par un pilote (viser un job test
          # assez long pour que la parallélisation de B produise un gain observable).
        run: pytest

      - name: Secret scan (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: "."
          scanners: secret
          format: json
          output: trivy-secret.json
          exit-code: "0"

      - name: SBOM (Syft)
        uses: anchore/sbom-action@v0.17.2
        with:
          path: "."
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json

      - name: SCA — vulnerability scan (Trivy fs)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: "."
          scanners: vuln
          format: json
          output: trivy-fs.json
          severity: CRITICAL,HIGH,MEDIUM,LOW
          exit-code: "0"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-a-reports
          path: |
            coverage.xml
            sbom.cyclonedx.json
            trivy-fs.json
            trivy-secret.json
          if-no-files-found: warn
          retention-days: 30
